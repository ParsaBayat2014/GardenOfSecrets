<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#153d37"><title>راز باغ فیروزه</title><link rel="stylesheet" href="style.css"></head><body>
<main id="game">
 <div id="world"><img id="scenery" src="art/garden.webp" alt="حیاط باغ فیروزه"><div id="restoration"></div><div id="hotspots"></div><div class="shade"></div></div>
 <header id="hud" hidden><div class="place"><small id="chapter">فصل اول • میراث پنهان</small><strong id="place">حیاط باغ</strong></div><div class="tools"><span class="currency" id="stars"></span><button id="notesBtn" aria-label="دفتر سرنخ‌ها"></button><button id="mapBtn" aria-label="نقشهٔ باغ"></button><button id="settingsBtn" aria-label="تنظیمات"></button></div></header>
 <aside id="objective" hidden><span class="objective-mark">◇</span><div><small>قدم بعدی</small><strong id="goal"></strong></div><button id="hintBtn" aria-label="راهنمای مرحله">؟</button></aside>
 <button id="returnBtn" class="return" hidden>بازگشت به حیاط ←</button>
 <div id="selection" hidden></div><div id="toast" role="status"></div>
 <footer id="inventory" hidden><div class="bag-label"><span id="bagIcon"></span><small>کیف رها</small></div><div id="bag"></div><button id="renovateBtn" class="renovate">✧<span>بازسازی باغ</span></button></footer>
 <section id="menu"><div class="menu-frame"><div class="eyebrow">یک باغ قدیمی، هزار راز ناگفته</div><div class="ornament">✦</div><h1>راز باغ<br><em>فیروزه</em></h1><p>هر سرنخ، دری به یک خاطره…</p><button id="startBtn" class="primary">قدم به باغ بگذار <span>←</span></button><small class="version">فصل اول: میراث پنهان • نسخهٔ ۰٫۱</small></div><div class="menu-bottom">جست‌وجو کن · سرنخ‌ها را به هم وصل کن · باغ را زنده کن</div></section>
 <div id="modal" hidden role="dialog" aria-modal="true"><section class="panel"><button id="closeModal" class="close" aria-label="بستن">×</button><div id="modalBody"></div></section></div>
 <div id="portraitGuard"><span>↻</span><p>برای دیدن تمام باغ، گوشی را افقی بگیر</p><button id="portraitContinue">ادامه در همین حالت</button></div>
</main><script src="model.js"></script><script src="game.js"></script></body></html>
