plugins { id 'com.android.application' }
def signing = new Properties()
def signingFile = rootProject.file('signing/release.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
android {
    namespace 'ir.toosarax.gardensecrets'
    compileSdk 34
    defaultConfig {
        applicationId 'ir.toosarax.gardensecrets'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }
    signingConfigs {
        release {
            if (!signing.isEmpty()) {
                storeFile rootProject.file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}
tasks.register('verifySigning') {
    doLast { if (signing.isEmpty()) throw new GradleException('Create local signing/release.properties before release builds') }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'verifySigning' }
